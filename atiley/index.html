<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atiley – Neon Encyclopedia for Kids</title>
<link rel="icon" href="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/atiley/ay.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
  :root{--p:#ff00ff;--c:#00ffff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Fredoka One',cursive;background:#0a001a;color:#e0ffff;min-height:100vh;cursor:none;overflow-x:hidden}
  #cursor{position:fixed;width:50px;height:50px;background:radial-gradient(circle,var(--p) 30%,transparent 70%);border:4px solid var(--c);border-radius:50%;pointer-events:none;z-index:999999;transform:translate(-50%,-50%);box-shadow:0 0 60px var(--p),0 0 100px var(--c)}
  ::-webkit-scrollbar{width:16px}::-webkit-scrollbar-track{background:#000}::-webkit-scrollbar-thumb{background:linear-gradient(var(--p),var(--c));border-radius:10px;box-shadow:0 0 30px var(--p)}
  header{text-align:center;padding:50px 20px}
  .logo{font-size:9rem;background:linear-gradient(90deg,var(--c),var(--p),var(--c));-webkit-background-clip:text;color:transparent;text-shadow:0 0 70px var(--p);}
  .tagline{font-size:2rem;margin:20px 0 40px}
  .search{max-width:900px;margin:0 auto;display:flex;gap:20px;padding:0 20px}
  #q{flex:1;padding:20px 30px;font-size:1.8rem;border:5px solid var(--p);border-radius:50px;background:rgba(0,0,0,0.7);color:white;text-align:center}
  #go{padding:20px 60px;font-size:2rem;background:linear-gradient(45deg,var(--p),var(--c));border:none;border-radius:50px;color:black;box-shadow:0 0 50px var(--p);cursor:pointer}
  main{max-width:1100px;margin:40px auto;padding:20px}
  .article{background:rgba(30,0,80,0.9);border-radius:40px;padding:60px;margin:30px 0;border:8px solid var(--c);box-shadow:0 0 90px var(--c);text-align:center}
  .article img{width:100%;max-height:600px;object-fit:contain;border-radius:35px;margin:30px 0;border:10px solid var(--p);box-shadow:0 0 90px var(--p)}
  h1{font-size:5.5rem;background:linear-gradient(90deg,var(--p),var(--c));-webkit-background-clip:text;color:transparent}
  .text{font-size:1.7rem;line-height:2.3;background:rgba(0,0,0,0.7);padding:35px;border-radius:30px;border:4px dashed var(--c)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:50px 0}
  .gallery img{width:100%;height:180px;object-fit:cover;border-radius:20px;border:5px solid var(--p);box-shadow:0 0 40px var(--p);transition:0.3s;cursor:pointer}
  .gallery img:hover{transform:scale(1.08)}
  a{display:inline-block;margin-top:40px;padding:20px 70px;font-size:2rem;background:var(--c);color:black;text-decoration:none;border-radius:50px;box-shadow:0 0 70px var(--c)}
</style>
</head>
<body>

<div id="cursor"></div>

<header>
  <h1 class="logo">Atiley</h1>
  <div class="tagline">The most magical encyclopedia for kids!</div>
  <div class="search">
    <input type="text" id="q" placeholder="dog, john cabot, pizza, github..." autocomplete="off">
    <button id="go">GO!</button>
  </div>
</header>

<main id="main"></main>

<script>
// Cursor
document.onmousemove=e=>{document.getElementById('cursor').style.cssText=`left:${e.clientX}px;top:${e.clientY}px;display:block`};

// ATILEY FUN FACTS ARE BACK — instant loading!
const funFacts = {
  "dog": {title:"Dog",main:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Cute_dog.jpg/800px-Cute_dog.jpg",text:"Dogs are man's best friend! They can smell 100,000 times better than humans and learn over 1,000 words!"},
  "john cabot": {title:"John Cabot",main:"https://upload.wikimedia.org/wikipedia/commons/4/4c/John_Cabot_portrait.jpg",text:"John Cabot was an Italian explorer who discovered North America for England in 1497 — before Columbus reached the mainland!"},
  "github": {title:"GitHub",main:"https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg",text:"GitHub is where the world builds software! Over 100 million developers share code there."},
  "nyan cat": {title:"Nyan Cat",main:"https://upload.wikimedia.org/wikipedia/en/0/03/Nyan_cat.png",text:"Famous flying Pop-Tart cat with rainbow trail! Created in 2011, over 200 million views!"},
  "pizza": {title:"Pizza",main:"https://upload.wikimedia.org/wikipedia/commons/a/a3/Eq_it-na_pizza-margherita_sep2005_sml.jpg",text:"Pizza started in Italy! The most expensive one costs $12,000 and has gold on it!"},
  "minecraft": {title:"Minecraft",main:"https://upload.wikimedia.org/wikipedia/en/b/bc/Minecraft_cover.png",text:"The best-selling game ever! Build anything with blocks and fight creepers!"},
  "unicorn": {title:"Unicorn",main:"https://upload.wikimedia.org/wikipedia/commons/3/38/Flag_of_Scotland.svg",text:"Magical horse with a rainbow horn! Scotland's national animal!"}
};

// Show article
function show(title, text, mainImg, gallery = [], source = "Atiley") {
  const g = gallery.length > 0 ? `<div class="gallery">${gallery.map(src=>`<img src="${src}" onerror="this.style.display='none'">`).join('')}</div>` : "";
  document.getElementById("main").innerHTML = `
    <div class="article">
      <h1>${title}</h1>
      <img src="${mainImg}" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg'">
      <div class="text">${text}</div>
      ${g}
      <div style="margin:30px;font-size:1.5rem;color:#88ffff">Source: ${source}</div>
      <a href="index.html">Back to Home</a>
    </div>`;
}

// ALL 25+ WIKIS — exactly your list — super fast
const WIKIS = [
  t => `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`,
  t => `https://simple.wikipedia.org/w/api.php?origin=*&action=query&prop=extracts|pageimages&exintro&explaintext&titles=${encodeURIComponent(t)}&format=json&pithumbsize=800`,
  t => `https://kids.britannica.com/kids/article/${t.replace(/ /g,'-')}/1000`,
  t => `https://kids.kiddle.co/${encodeURIComponent(t)}`,
  t => `https://en.wiktionary.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`,
  t => `https://en.wikibooks.org/w/api.php?origin=*&action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(t)}&format=json`,
  t => `https://en.wikiquote.org/w/api.php?origin=*&action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(t)}&format=json`,
  t => `https://en.wikisource.org/w/api.php?origin=*&action=query&prop=extracts&exintro&explaintext&titles=${encodeURIComponent(t)}&format=json`,
  t => `http://en.citizendium.org/wiki/${encodeURIComponent(t)}`,
  t => `http://www.scholarpedia.org/article/${encodeURIComponent(t.replace(/ /g,'_'))}`,
  t => `https://iq.wiki/wiki/${encodeURIComponent(t)}`,
  t => `https://en.metapedia.org/m/index.php?search=${encodeURIComponent(t)}`,
  t => `https://infogalactic.com/info/${encodeURIComponent(t)}`,
  t => `https://www.quora.com/search?q=${encodeURIComponent(t)}`,
  t => `https://www.reddit.com/search/?q=${encodeURIComponent(t)}`,
  t => `https://www.conservapedia.com/index.php?search=${encodeURIComponent(t)}`,
  t => `https://www.infoplease.com/search/site/${encodeURIComponent(t)}`,
  t => `https://en.uncyclopedia.co/wiki/${encodeURIComponent(t)}`,
  t => `https://www.encyclopedia.com/search?query=${encodeURIComponent(t)}`,
  t => `https://www.dictionary.com/browse/${encodeURIComponent(t)}`,
  t => `https://www.merriam-webster.com/dictionary/${encodeURIComponent(t)}`,
  t => `https://www.worldbookonline.com/wb/Search?st=${encodeURIComponent(t)}`,
  t => `https://web.archive.org/web/20230000000000/https://www.digitaluniverse.net/search?q=${encodeURIComponent(t)}`,
  t => `https://foundation.wikimedia.org/wiki/Search?search=${encodeURIComponent(t)}`,
  t => `https://www.nytimes.com/search?query=${encodeURIComponent(t)}`,
  t => `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(t)}&gsrlimit=5&prop=imageinfo&iiprop=url&format=json&origin=*`
];

const PROXY = "https://api.allorigins.win/raw?url=";

async function search(term) {
  term = term.trim();
  if (!term) return;

  // Instant Atiley Fun Facts
  if (funFacts[term.toLowerCase()]) {
    const a = funFacts[term.toLowerCase()];
    show(a.title, a.text, a.main, [a.main], "Atiley Fun Facts");
    return;
  }

  // Show loading max 2 seconds
  const timer = setTimeout(() => {
    document.getElementById("main").innerHTML = "<div style='text-align:center;font-size:6rem;margin:200px;color:#ff00ff'>Loading from 25+ wikis...</div>";
  }, 300);

  for (let makeUrl of WIKIS) {
    try {
      const url = makeUrl(term);
      const res = await fetch(PROXY + url, {signal: AbortSignal.timeout(4000)});
      if (!res.ok) continue;
      const data = await res.json().catch(() => res.text());
      if (data && (data.extract || data.title)) {
        const img = data.originalimage?.source || data.thumbnail?.source || data.imageinfo?.[0]?.url || "https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg";
        clearTimeout(timer);
        show(data.title || term, data.extract?.slice(0,1400)+"..." || "Found it!", img, [img], "Wikipedia & Friends");
        return;
      }
    } catch (e) {}
  }

  clearTimeout(timer);
  // Brave Images fallback
  const braveImages = await fetch(`https://search.brave.com/api/v1/images/search?q=${encodeURIComponent(term)}&count=6&safesearch=strict`)
    .then(r => r.json())
    .then(d => d?.results?.map(r => r.thumbnail?.src || r.url).filter(Boolean) || [])
    .catch(() => []);
  show(term, `Found ${braveImages.length} cool pictures about "${term}"!`, braveImages[0] || "https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg", braveImages, "Brave Images");
}

// Button
document.getElementById("go").onclick = () => {
  const q = document.getElementById("q").value.trim();
  if (q) search(q);
};
document.getElementById("q").onkeydown = e => { if(e.key==="Enter") document.getElementById("go").click(); };

// Start
window.onload = () => {
  const q = new URLSearchParams(location.search).get("q");
  if (q) {
    document.getElementById("q").value = q;
    document.getElementById("go").click();
  } else {
    document.getElementById("main").innerHTML = `
      <div class="article">
        <h1>Welcome to Atiley!</h1>
        <p style="font-size:2.5rem">Try: dog • john cabot • pizza • github • nyan cat • unicorn • minecraft</p>
      </div>`;
  }
};
</script>
</body>
</html>
