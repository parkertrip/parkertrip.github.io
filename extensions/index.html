<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/extensions/PJ%E2%80%99S.png"/>
  <title>𝓟𝓙'𝓢 𝓔𝓧𝓣𝓔𝓝𝓢𝓘𝓞𝓝𝓢</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Audiowide&family=Rajdhani:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f6ff;
      --pink: #ff00d0;
      --purple: #c800ff;
      --yellow: #ffff00;
      --bg-dark: #0a001a;
      --card-dark: rgba(20,0,50,0.78);
      --text-dark: #ffffff;
      --bg-light: #f8f8ff;
      --card-light: rgba(255,255,255,0.92);
      --text-light: #000000;
    }
    body { 
      margin:0; padding:0; 
      background: var(--bg-dark); 
      color: var(--text-dark);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.8s, color 0.8s;
    }
    body.light { background: var(--bg-light); color: var(--text-light); }

    /* ===== CUSTOM SCROLLBAR FROM YOUR EXTENSION (NOW ACTIVE!) ===== */
    ::-webkit-scrollbar { width: 16px; }
    ::-webkit-scrollbar-track { 
      background: transparent; 
      border: 2px solid var(--cyan);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, var(--cyan), var(--pink), var(--purple));
      border-radius: 10px;
      box-shadow: 0 0 20px var(--pink);
      border: 2px solid var(--bg-dark);
    }
    body.light ::-webkit-scrollbar-thumb { border-color: var(--bg-light); }

    canvas { position: fixed; inset: 0; z-index: -2; opacity: 0.5; }
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: -1; }

    header {
      text-align: center;
      padding: 10rem 1rem 5rem;
      position: relative;
      z-index: 10;
    }
    h1 {
      font-family: 'Audiowide', cursive;
      font-size: clamp(5rem, 15vw, 11rem);
      background: linear-gradient(90deg, var(--cyan), var(--pink), var(--purple), var(--yellow), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 100px rgba(0,246,255,0.9);
      animation: rainbow 8s linear infinite, bigGlow 3s ease-in-out infinite alternate;
    }
    @keyframes rainbow { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    @keyframes bigGlow { from { text-shadow: 0 0 100px rgba(0,246,255,0.9); } to { text-shadow: 0 0 160px rgba(255,0,208,1); } }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 4rem;
      perspective: 2000px;
    }

    .card {
      background: var(--card-dark);
      border-radius: 32px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      border: 3px solid transparent;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      transition: all 0.6s ease;
      transform-style: preserve-3d;
    }
    body.light .card { background: var(--card-light); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }

    /* Electric animated border */
    .card::before {
      content: '';
      position: absolute;
      inset: -6px;
      background: linear-gradient(45deg, var(--cyan), var(--pink), var(--purple), var(--yellow), var(--cyan));
      border-radius: 36px;
      z-index: -1;
      opacity: 0;
      filter: blur(8px);
      animation: electric 6s linear infinite;
    }
    .card:hover::before { opacity: 1; animation-duration: 2s; }
    @keyframes electric { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

    .card:hover {
      transform: translateZ(60px) rotateX(8deg) rotateY(8deg) scale(1.1);
      box-shadow: 0 60px 140px rgba(255,0,208,0.9);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-bottom: 10px double var(--cyan);
      transition: 0.7s;
    }
    .card:hover img { filter: brightness(1.6) hue-rotate(30deg) saturate(2); }

    .card h3 {
      font-family: 'Orbitron', sans-serif;
      padding: 1.8rem 1rem 1.2rem;
      text-align: center;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseText 4s infinite;
    }
    @keyframes pulseText { 0%,100% { opacity: 0.9; } 50% { opacity: 1; text-shadow: 0 0 40px var(--pink); } }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      padding: 0 2rem 2.5rem;
    }
    .btn {
      padding: 1.3rem;
      text-align: center;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1.1rem;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s;
      background: rgba(255,255,255,0.1);
      border: 3px solid var(--cyan);
    }
    .btn:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,246,255,0.6);
      background: var(--cyan);
      color: black !important;
    }

    .pin {
      position: absolute;
      top: 20px; right: 20px;
      width: 60px; height: 60px;
      background: #00000088;
      border: 4px solid var(--yellow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: 0.5s;
      z-index: 10;
    }
    .pin.pinned {
      background: var(--yellow);
      color: black;
      animation: spinGlow 2s infinite;
    }
    @keyframes spinGlow { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(1); } }

    .controls {
      text-align: center;
      padding: 2rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    #search {
      padding: 1.2rem 2.5rem;
      font-size: 1.3rem;
      border-radius: 50px;
      border: 4px solid var(--cyan);
      background: rgba(0,0,0,0.6);
      color: white;
      width: 400px;
      max-width: 90%;
    }
    body.light #search { background: white; color: black; }

    footer { text-align: center; padding: 8rem 1rem; font-size: 1.4rem; color: #888; }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>
  <div class="particles" id="particles"></div>

  <header>
    <h1>𝓟𝓙'𝓢 𝓔𝓧𝓣𝓔𝓝𝓢𝓘𝓞𝓝𝓢</h1>
    <p style="font-family:Orbitron; font-size:2.5rem; background:linear-gradient(90deg,#00f6ff,#ff00d0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
      MAXIMUM NEON OVERDRIVE
    </p>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Search extensions..." oninput="render()">
    <button class="btn" onclick="document.body.classList.toggle('light'); render()">Light/Dark Mode</button>
    <button class="btn" id="favBtn" onclick="toggleFavorites()">Favorites Only (0)</button>
  </div>

  <div class="container" id="extensions"></div>

  <footer>
    Created with infinite neon energy by <strong>ParkerTrip</strong> • 2025
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script>
    const base = "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/extensions/";
    const extensions = [
      { name: "Custom Scrollbar",      img: "Untitled%20design%20(4).png", file: "scrool.js" },
      { name: "Custom Favicon",        img: "Untitled%20design%20(5).png", file: "favicon.js" },
      { name: "Particles and Trails",  img: "Untitled%20design%20(6).png", file: "P&T.js" },
      { name: "Files",                 img: "Untitled%20design%20(7).png", file: "files.js" }
    ];

    let pinned = JSON.parse(localStorage.getItem("pj-pinned-final") || "[]");
    let showFavorites = false;

    function forceDownload(url, filename) {
      fetch(url)
        .then(res => res.blob())
        .then(blob => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        });
    }

    function togglePin(file) {
      if (pinned.includes(file)) {
        pinned = pinned.filter(f => f !== file);
      } else {
        pinned.push(file);
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
        new Audio("https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3").play().catch(()=>{});
      }
      localStorage.setItem("pj-pinned-final", JSON.stringify(pinned));
      document.getElementById("favBtn").innerHTML = `Favorites Only (${pinned.length})`;
      render();
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url);
      const btn = event.target;
      const old = btn.innerText;
      btn.innerText = "COPIED!";
      btn.style.background = "#00ff00";
      setTimeout(() => { btn.innerText = old; btn.style.background = ""; }, 1000);
    }

    function toggleFavorites() {
      showFavorites = !showFavorites;
      document.getElementById("favBtn").style.background = showFavorites ? "#ffff00" : "";
      render();
    }

    function render() {
      const q = document.getElementById("search").value.toLowerCase();
      document.getElementById("extensions").innerHTML = "";
      extensions
        .filter(e => !showFavorites || pinned.includes(e.file))
        .filter(e => e.name.toLowerCase().includes(q))
        .forEach(e => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="pin ${pinned.includes(e.file) ? 'pinned' : ''}" onclick="togglePin('${e.file}')">★</div>
            <img src="${base}${e.img}" alt="${e.name}">
            <h3>${e.name}</h3>
            <div class="buttons">
              <a href="https://studio.penguinmod.com/editor.html?extension=${base}${e.file}" target="_blank" class="btn">Open in Editor</a>
              <div class="btn" onclick="forceDownload('${base}${e.file}', '${e.file}')">Download .js</div>
              <div class="btn" onclick="copyUrl('${base}${e.file}')">Copy URL</div>
              <a href="${base}${e.file}" target="_blank" class="btn">View Source</a>
            </div>
          `;
          document.getElementById("extensions").appendChild(card);
        });
    }

    // Matrix rain + particles
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    canvas.width = innerWidth; canvas.height = innerHeight;
    const drops = Array(Math.floor(canvas.width/18)).fill(1);
    const chars = "ネオンPJ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    setInterval(() => {
      ctx.fillStyle = "rgba(10,0,26,0.05)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#00f6ff";
      ctx.font = "18px monospace";
      for(let i=0; i<drops.length; i++){
        const char = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(char, i*18, drops[i]*18);
        if(drops[i]*18 > canvas.height && Math.random()>0.97) drops[i]=0;
        drops[i]++;
      }
    }, 35);

    // 100 glowing particles
    for(let i=0; i<100; i++){
      const p = document.createElement("div");
      p.style.cssText = `position:absolute;width:${r=5+Math.random()*10}px;height:${r}px;background:#${["00f6ff","ff00d0","c800ff","ffff00"][i%4]};border-radius:50%;left:${Math.random()*100}%;top:-20px;animation:fall ${8+Math.random()*12}s linear infinite;animation-delay:${Math.random()*20}s;opacity:0.8;box-shadow:0 0 20px currentColor;`;
      document.getElementById("particles").appendChild(p);
    }
    const style = document.createElement("style");
    style.innerHTML = `@keyframes fall { 0%{transform:translateY(-100px) rotate(0deg);} 100%{transform:translateY(110vh) rotate(3600deg);} }`;
    document.head.appendChild(style);

    render();
    document.getElementById("favBtn").innerHTML = `Favorites Only (${pinned.length})`;
  </script>
</body>
</html>
