<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizerdz</title>
    <link rel="icon" href="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled%20design%20(4).png">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }
        #game-container {
            width: 1100px;
            height: 750px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            border: 4px solid rgba(255,255,255,0.3);
            position: relative;
        }
        #title { font-size: 60px; text-align: center; margin-bottom: 10px; text-shadow: 0 0 20px #fff; }
        button { padding: 14px 30px; margin: 10px; font-size: 20px; background: #ff4500; border: none; border-radius: 15px; color: white; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.5); transition: 0.3s; }
        button:hover { transform: scale(1.05); }
        .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .avatar-option { width: 120px; height: 120px; background-size: cover; border-radius: 20px; border: 4px solid transparent; cursor: pointer; transition: 0.3s; }
        .avatar-option:hover, .avatar-option.selected { border: 4px solid #ff0; box-shadow: 0 0 20px #ff0; }
        #setup-screen, #game-screen { display: none; }
        #log { height: 140px; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 15px; overflow-y: auto; margin-top: 20px; font-size: 17px; }
        #pet { width: 120px; height: 120px; background-size: contain; position: absolute; bottom: 30px; left: 30px; }
        #friends-list, #inventory { position: absolute; top: 120px; right: 30px; width: 220px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; }
        #inventory { top: 320px; }
        .zone-btn { padding: 15px; background: rgba(255,255,255,0.2); margin: 10px; border-radius: 15px; cursor: pointer; }
        .zone-btn:hover { background: rgba(255,255,255,0.4); }
        #setup-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 1100px;
            height: 750px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 4px solid rgba(255,255,255,0.3);
            padding: 30px;
        }
        #username-input {
            padding: 12px;
            font-size: 20px;
            border-radius: 10px;
            border: none;
            width: 300px;
            margin: 20px 0;
        }
        #start-game-btn {
            padding: 14px 30px;
            font-size: 20px;
            background: #ff4500;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        #start-game-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- CHARACTER CREATION -->
    <div id="setup-screen">
        <h1 style="font-size:70px;text-align:center;margin:20px;">Welcome to Wizerdz</h1>
        <p style="text-align:center;font-size:24px;">Create your wizard!</p>
        <div style="text-align:center;margin:30px;">
            <input type="text" id="username-input" placeholder="Enter your wizard name" maxlength="16">
        </div>
        <p style="text-align:center;font-size:22px;">Choose your look:</p>
        <div class="avatar-grid" style="justify-content:center;">
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2021/12/20/17/20/cat-6883556_1280.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2012/04/18/23/36/boy-38262_1280.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2017/06/13/12/53/profile-2398782_640.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2017/02/23/13/05/avatar-2092113_640.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2016/12/07/21/01/cartoon-1890438_1280.jpg"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2017/08/26/16/03/parrot-2683452_640.png"></div>
        </div>
        <div style="text-align:center;">
            <button id="start-game-btn">Begin Your Adventure!</button>
        </div>
    </div>

    <!-- MAIN GAME -->
    <div id="game-container" style="display:none;" id="game-screen">
        <div id="title">Wizerdz</div>
        <button id="new-game" style="position:absolute;top:20px;right:30px;background:#900;">New Wizard</button>

        <div id="status" style="text-align:center;font-size:28px;margin:20px;"></div>
        <div id="world-map" style="text-align:center;"></div>

        <div style="display:flex;justify-content:space-around;align-items:center;margin:30px 0;">
            <div style="text-align:center;">
                <div id="player" style="width:200px;height:200px;background-size:cover;border-radius:20px;margin:0 auto 10px;"></div>
                <div class="stats" id="player-stats"></div>
            </div>
            <div style="text-align:center;">
                <div id="enemy" style="width:200px;height:200px;background-size:cover;border-radius:20px;margin:0 auto 10px;"></div>
                <div class="stats" id="enemy-stats"></div>
            </div>
        </div>

        <div id="actions" style="text-align:center;"></div>
        <div id="log"></div>

        <div id="friends-list"><h3>Friends Online</h3><ul id="friends-ul"></ul></div>
        <div id="inventory"><h3>Inventory</h3><ul id="inventory-ul"></ul></div>
        <div id="pet"></div>
    </div>

    <script>
        const STORAGE_KEY = 'wizerdz_profile_v6';
        const avatars = [
            "https://cdn.pixabay.com/photo/2021/12/20/17/20/cat-6883556_1280.png",
            "https://cdn.pixabay.com/photo/2012/04/18/23/36/boy-38262_1280.png",
            "https://cdn.pixabay.com/photo/2017/06/13/12/53/profile-2398782_640.png",
            "https://cdn.pixabay.com/photo/2017/02/23/13/05/avatar-2092113_640.png",
            "https://cdn.pixabay.com/photo/2016/12/07/21/01/cartoon-1890438_1280.jpg",
            "https://cdn.pixabay.com/photo/2017/08/26/16/03/parrot-2683452_640.png"
        ];

        const pets = [
            { name: "Fire Pup", bonus: 6, image: "https://cdn.pixabay.com/photo/2023/06/03/09/37/dog-8037326_640.jpg" },
            { name: "Ice Bird", bonus: 5, image: "https://cdn.pixabay.com/photo/2022/01/21/04/58/blue-jay-6953940_640.jpg" },
            { name: "Thunder Cat", bonus: 8, image: "https://cdn.pixabay.com/photo/2022/01/01/21/31/jumping-cat-6909026_640.png" }
        ];

        const foods = [
            { name: "Pizza Slice", hp: 50, attack: 11, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design-removebg-preview.png" },
            { name: "Burger", hp: 65, attack: 13, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/5t3q.png" },
            { name: "Ice Cream", hp: 45, attack: 9, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design__1_-removebg-preview.png" },
            { name: "Apple", hp: 35, attack: 7, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design__2_-removebg-preview.png" },
            { name: "Cake", hp: 80, attack: 16, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design__3_-removebg-preview.png" }
        ];

        const zones = ["Mystic Forest", "Crystal Caves", "Sky Islands", "Volcano Peaks"];
        const spells = [
            { name: "Fireball", damage: 25, color: "#ff4444" },
            { name: "Frost Nova", damage: 20, color: "#44ccff", effect: "freeze" },
            { name: "Thunderstrike", damage: 32, color: "#ffff44" },
            { name: "Life Surge", damage: -30, color: "#44ff88" }
        ];

        let player = null;
        let enemy = null;
        let gameState = "setup";
        let frozen = false;

        const fakeNames = ["BlazeMage", "Frosty", "ThunderKid", "ShadowNinja", "StarWizard", "LunaHex", "Cosmo", "PixelSorcerer"];

        function log(msg) {
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<p>${msg}</p>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Setup screen
        let selectedAvatar = avatars[0];
        document.querySelectorAll('.avatar-option').forEach((el, i) => {
            el.style.backgroundImage = `url('${avatars[i]}')`;
            el.onclick = () => {
                document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
                el.classList.add('selected');
                selectedAvatar = avatars[i];
            };
        });
        document.querySelector('.avatar-option').classList.add('selected');

        document.getElementById('start-game-btn').onclick = () => {
            const username = document.getElementById('username-input').value.trim() || "MysteryWizard";
            player = {
                name: username,
                avatar: selectedAvatar,
                hp: 120, maxHp: 120, level: 1, exp: 0,
                zone: 0, pet: null, friends: [], inventory: []
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('player').style.backgroundImage = `url('${player.avatar}')`;
            gameState = "world";
            log(`Welcome, <strong>${player.name}</strong>! Your legend begins...`);
            updateUI();
        };

        // Load or new game
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            player = JSON.parse(saved);
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('player').style.backgroundImage = `url('${player.avatar}')`;
            gameState = "world";
            log(`Welcome back, <strong>${player.name}</strong>!`);
            updateUI();
        }

        document.getElementById('new-game').onclick = () => {
            if (confirm("Abandon this wizard and create a new one?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        };

        function updateUI() {
            document.getElementById('player-stats').innerHTML = `
                <strong>${player.name} (Lv${player.level})</strong><br>
                HP: ${player.hp}/${player.maxHp}<br>
                EXP ${player.exp}/100
            `;

            // Pet
            const petEl = document.getElementById('pet');
            if (player.pet) {
                petEl.style.backgroundImage = `url('${player.pet.image}')`;
                petEl.title = player.pet.name;
            } else petEl.style.backgroundImage = '';

            // Friends
            const friendsUl = document.getElementById('friends-ul');
            friendsUl.innerHTML = player.friends.length ? player.friends.map(f => `<li>${f}</li>`).join('') : '<li>No friends yet...</li>';

            // Inventory
            document.getElementById('inventory-ul').innerHTML = player.inventory.length ? player.inventory.map(i => `<li>${i}</li>`).join('') : '<li>Empty</li>';

            if (gameState === "world") {
                document.getElementById('status').textContent = "Choose your destiny!";
                document.getElementById('world-map').innerHTML = zones.map((z,i) => 
                    `<div class="zone-btn" onclick="enterZone(${i})">${z}</div>`
                ).join('');
                document.getElementById('enemy').style.backgroundImage = '';
                document.getElementById('enemy-stats').innerHTML = '';
                document.getElementById('actions').innerHTML = '';
            } else if (gameState === "explore") {
                document.getElementById('status').textContent = `Exploring ${zones[player.zone]}`;
                document.getElementById('world-map').innerHTML = '';
                document.getElementById('enemy').style.backgroundImage = '';
                document.getElementById('enemy-stats').innerHTML = '';
                document.getElementById('actions').innerHTML = `
                    <button onclick="startBattle('food')">Hunt Food Monster</button>
                    <button onclick="startBattle('player')">Duel Another Wizard</button>
                    <button onclick="gameState='world';updateUI()">World Map</button>
                `;
            } else if (gameState.includes("battle")) {
                document.getElementById('world-map').innerHTML = '';
                document.getElementById('status').textContent = `Battling ${enemy.name}!`;
                document.getElementById('enemy').style.backgroundImage = `url('${enemy.image}')`;
                document.getElementById('enemy-stats').innerHTML = `<strong>${enemy.name}</strong><br>HP: ${enemy.hp}/${enemy.maxHp}`;
                document.getElementById('actions').innerHTML = '';
                spells.forEach(s => {
                    const b = document.createElement('button');
                    b.textContent = s.name;
                    b.style.background = s.color;
                    b.onclick = () => castSpell(s);
                    document.getElementById('actions').appendChild(b);
                });
            } else if (gameState === "gameover") {
                document.getElementById('status').textContent = "Game Over!";
                document.getElementById('actions').innerHTML = '<button onclick="location.reload()">Rise Again</button>';
            }
        }

        function enterZone(i) {
            player.zone = i;
            gameState = "explore";
            log(`You arrived at <strong>${zones[i]}</strong>...`);
            updateUI();
        }

        function startBattle(type) {
            if (type === 'food') {
                const f = foods[Math.floor(Math.random()*foods.length)];
                const mult = 1 + player.zone*0.5;
                enemy = {
                    name: f.name,
                    hp: Math.round(f.hp * mult),
                    maxHp: Math.round(f.hp * mult),
                    attack: Math.round(f.attack * mult),
                    image: f.image
                };
                gameState = "battle_food";
                log(`A wild <strong>${enemy.name}</strong> attacks!`);
            } else {
                const name = fakeNames[Math.floor(Math.random()*fakeNames.length)] + Math.floor(Math.random()*999);
                enemy = {
                    name: name,
                    hp: 100 + player.level*25,
                    maxHp: 100 + player.level*25,
                    attack: 12 + player.level*4,
                    image: avatars[Math.floor(Math.random()*avatars.length)]
                };
                gameState = "battle_player";
                log(`You encounter wizard <strong>${name}</strong>!`);
            }
            updateUI();
        }

        function castSpell(spell) {
            let dmg = spell.damage + player.level*4;
            if (player.pet) dmg += player.pet.bonus;
            if (spell.damage < 0) {
                player.hp = Math.min(player.maxHp, player.hp - spell.damage);
                log(`You cast <strong style="color:${spell.color}">${spell.name}</strong> — healed ${-spell.damage} HP!`);
            } else {
                enemy.hp -= dmg;
                log(`<strong style="color:${spell.color}">${spell.name}</strong> → ${dmg} damage!`);
            }
            if (spell.effect === "freeze") frozen = true;

            if (enemy.hp <= 0) {
                log(`<strong>${enemy.name}</strong> defeated! +50 EXP`);
                player.exp += 50;
                if (gameState === "battle_player" && Math.random() < 0.4 && !player.friends.includes(enemy.name)) {
                    player.friends.push(enemy.name);
                    log(`You befriended <strong>${enemy.name}</strong>!`);
                }
                if (!player.pet && Math.random() < 0.25) {
                    player.pet = pets[Math.floor(Math.random()*pets.length)];
                    log(`${player.pet.name} chose you as its master!`);
                }
                if (Math.random() < 0.3) {
                    const items = ["Star Shard", "Mana Crystal", "Golden Carrot", "Wizard Hat"];
                    const item = items[Math.floor(Math.random()*items.length)];
                    if (!player.inventory.includes(item)) player.inventory.push(item);
                    log(`Found: ${item}!`);
                }
                if (player.exp >= 100) {
                    player.level++;
                    player.maxHp += 40;
                    player.hp = player.maxHp;
                    player.exp -= 100;
                    log(`LEVEL UP! You are now level ${player.level}!`);
                }
                enemy = null;
                gameState = "explore";
                localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
                updateUI();
                return;
            }

            if (!frozen) {
                const edmg = Math.max(5, enemy.attack - player.level);
                player.hp -= edmg;
                log(`${enemy.name} hits you for ${edmg}!`);
            } else {
                log(`${enemy.name} is frozen!`);
                frozen = false;
            }

            if (player.hp <= 0) {
                player.hp = 0;
                gameState = "gameover";
                log('<span style="color:#ff4444">GAME OVER — Your wizard has fallen...</span>');
                document.getElementById('actions').innerHTML = '<button onclick="location.reload()">Rise Again</button>';
            }
            updateUI();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
        }

        // Auto-start if already have a wizard
        if (player) updateUI();
    </script>
</body>
</html>
