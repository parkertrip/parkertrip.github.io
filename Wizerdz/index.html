<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizerdz</title>
    <link rel="icon" href="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled%20design%20(4).png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #setup-screen, #game-container {
            width: 1100px;
            height: 750px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            border: 5px solid rgba(255,255,255,0.2);
            text-align: center;
        }
        h1 { font-size: 80px; margin: 20px 0; text-shadow: 0 0 20px #fff; }
        input { padding: 15px; font-size: 22px; width: 360px; border-radius: 12px; border: none; margin: 20px 0; }
        button { padding: 16px 40px; font-size: 22px; background: #ff4500; border: none; border-radius: 16px; color: white; cursor: pointer; margin: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        button:hover { transform: translateY(-4px); }
        .avatar-grid { display: grid; grid-template-columns: repeat(3, 140px); gap: 20px; justify-content: center; margin: 30px auto; }
        .avatar-option {
            width: 140px; height: 140px; background-size: cover; background-position: center;
            border-radius: 25px; border: 6px solid transparent; cursor: pointer;
        }
        .avatar-option:hover, .avatar-option.selected { border-color: #ffff00; box-shadow: 0 0 30px #ffff00; }
        #title { font-size: 70px; margin-bottom: 10px; text-shadow: 0 0 30px #00ddff; }
        #log { height: 150px; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 15px; overflow-y: auto; margin-top: 20px; font-size: 18px; }
        #pet { width: 130px; height: 130px; background-size: contain; position: absolute; bottom: 30px; left: 40px; }
        .zone-btn { display: inline-block; padding: 20px 40px; margin: 15px; background: rgba(255,255,255,0.15); border-radius: 20px; cursor: pointer; font-size: 20px; }
        .zone-btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <!-- CHARACTER CREATION -->
    <div id="setup-screen">
        <h1>Welcome to Wizerdz</h1>
        <p style="font-size:28px;">Create your wizard!</p>
        <input type="text" id="username-input" placeholder="Your wizard name" maxlength="16">
        <p style="font-size:26px;margin:30px 0 10px;">Choose your look:</p>
        <div class="avatar-grid">
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2021/12/20/17/20/cat-6883556_1280.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2012/04/18/23/36/boy-38262_1280.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2017/06/13/12/53/profile-2398782_640.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2017/02/23/13/05/avatar-2092113_640.png"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2016/12/07/21/01/cartoon-1890438_1280.jpg"></div>
            <div class="avatar-option" data-img="https://cdn.pixabay.com/photo/2017/08/26/16/03/parrot-2683452_640.png"></div>
        </div>
        <button id="start-game-btn">Begin Adventure!</button>
    </div>

    <!-- MAIN GAME (hidden until login) -->
    <div id="game-container" style="display:none;">
        <div id="title">Wizerdz</div>
        <button id="new-game" style="position:absolute;top:20px;right:30px;background:#900;">New Wizard</button>

        <div id="status" style="font-size:32px;margin:20px 0;"></div>
        <div id="world-map"></div>

        <div style="display:flex;justify-content:space-around;margin:30px 0;">
            <div>
                <div id="player" style="width:220px;height:220px;background-size:cover;border-radius:30px;margin:auto;"></div>
                <div style="margin-top:15px;font-size:22px;background:rgba(0,0,0,0.4);padding:12px;border-radius:15px;" id="player-stats"></div>
            </div>
            <div>
                <div id="enemy" style="width:220px;height:220px;background-size:cover;border-radius:30px;margin:auto;"></div>
                <div style="margin-top:15px;font-size:22px;background:rgba(0,0,0,0.4);padding:12px;border-radius:15px;" id="enemy-stats"></div>
            </div>
        </div>

        <div id="actions" style="margin:30px 0;"></div>
        <div id="log"></div>
        <div id="pet"></div>
    </div>

    <script>
        const STORAGE_KEY = 'wizerdz_save_final';
        const avatars = [
            "https://cdn.pixabay.com/photo/2021/12/20/17/20/cat-6883556_1280.png",
            "https://cdn.pixabay.com/photo/2012/04/18/23/36/boy-38262_1280.png",
            "https://cdn.pixabay.com/photo/2017/06/13/12/53/profile-2398782_640.png",
            "https://cdn.pixabay.com/photo/2017/02/23/13/05/avatar-2092113_640.png",
            "https://cdn.pixabay.com/photo/2016/12/07/21/01/cartoon-1890438_1280.jpg",
            "https://cdn.pixabay.com/photo/2017/08/26/16/03/parrot-2683452_640.png"
        ];

        const pets = [
            { name: "Fire Pup",     bonus: 6, image: "https://cdn.pixabay.com/photo/2023/06/03/09/37/dog-8037326_640.jpg" },
            { name: "Ice Bird",     bonus: 5, image: "https://cdn.pixabay.com/photo/2022/01/21/04/58/blue-jay-6953940_640.jpg" },
            { name: "Thunder Cat",  bonus: 8, image: "https://cdn.pixabay.com/photo/2022/01/01/21/31/jumping-cat-6909026_640.png" }
        ];

        const foods = [ /* same as before */ 
            { name: "Pizza Slice", hp: 50, attack: 11, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design-removebg-preview.png" },
            { name: "Burger",      hp: 65, attack: 13, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/5t3q.png" },
            { name: "Ice Cream",   hp: 45, attack: 9,  image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design__1_-removebg-preview.png" },
            { name: "Apple",       hp: 35, attack: 7,  image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design__2_-removebg-preview.png" },
            { name: "Cake",        hp: 80, attack: 16, image: "https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/Wizerdz/Untitled_design__3_-removebg-preview.png" }
        ];

        const zones = ["Mystic Forest", "Crystal Caves", "Sky Islands", "Volcano Peaks"];
        const spells = [
            { name: "Fireball",     damage: 25, color: "#ff4444" },
            { name: "Frost Nova",   damage: 20, color: "#44ccff", effect: "freeze" },
            { name: "Thunderstrike",damage: 32, color: "#ffff44" },
            { name: "Life Surge",   damage: -30, color: "#44ff88" }
        ];

        let player = null;
        let enemy = null;
        let gameState = "setup";
        let frozen = false;

        // === CHARACTER CREATION ===
        let selectedAvatar = avatars[0];
        document.querySelectorAll('.avatar-option').forEach((el, i) => {
            el.style.backgroundImage = `url('${avatars[i]}')`;
            el.onclick = () => {
                document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
                el.classList.add('selected');
                selectedAvatar = avatars[i];
            };
        });
        document.querySelector('.avatar-option').classList.add('selected');

        document.getElementById('start-game-btn').onclick = () => {
            const name = document.getElementById('username-input').value.trim() || "Wizard";
            player = {
                name, avatar: selectedAvatar,
                hp: 120, maxHp: 120, level: 1, exp: 0,
                zone: 0, pet: null, friends: [], inventory: []
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
            startGame();
        };

        // === LOAD SAVED WIZARD ===
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            player = JSON.parse(saved);
            startGame();
        }

        function startGame() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('player').style.backgroundImage = `url('${player.avatar}')`;
            gameState = "world";
            log(`Welcome ${player.name ? 'back, <strong>' + player.name + '</strong>!' : 'to Wizerdz!'}`);
            updateUI();
        }

        document.getElementById('new-game').onclick = () => {
            if (confirm("Delete this wizard and start over?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        };

        function log(msg) {
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<p>${msg}</p>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateUI() {
            document.getElementById('player-stats').innerHTML = `<strong>${player.name} (Lv${player.level})</strong><br>HP: ${player.hp}/${player.maxHp}<br>EXP: ${player.exp}/100`;

            if (player.pet) document.getElementById('pet').style.backgroundImage = `url('${player.pet.image}')`;
            
            if (gameState === "world") {
                document.getElementById('status').textContent = "Choose a zone!";
                document.getElementById('world-map').innerHTML = zones.map((z,i) => `<div class="zone-btn" onclick="enterZone(${i})">${z}</div>`).join('');
                document.getElementById('enemy').style.backgroundImage = '';
                document.getElementById('enemy-stats').innerHTML = '';
                document.getElementById('actions').innerHTML = '';
            } else if (gameState === "explore") {
                document.getElementById('status').textContent = `Exploring ${zones[player.zone]}`;
                document.getElementById('actions').innerHTML = `
                    <button onclick="startBattle('food')">Hunt Food</button>
                    <button onclick="startBattle('player')">Duel Wizard</button>
                    <button onclick="gameState='world';updateUI()">World Map</button>
                `;
            } else if (gameState.includes("battle")) {
                document.getElementById('status').textContent = `Battle: ${enemy.name}!`;
                document.getElementById('enemy').style.backgroundImage = `url('${enemy.image}')`;
                document.getElementById('enemy-stats').innerHTML = `<strong>${enemy.name}</strong><br>HP: ${enemy.hp}/${enemy.maxHp}`;
                document.getElementById('actions').innerHTML = '';
                spells.forEach(s => {
                    const b = document.createElement('button');
                    b.textContent = s.name;
                    b.style.backgroundColor = s.color;
                    b.onclick = () => castSpell(s);
                    document.getElementById('actions').appendChild(b);
                });
            }
        }

        function enterZone(i){ player.zone=i; gameState="explore"; log(`Entered ${zones[i]}`); updateUI(); }
        function startBattle(t){ /* same code as before – works perfectly */ 
            const mult = 1 + player.zone*0.6;
            if (t==='food'){
                const f=foods[Math.floor(Math.random()*foods.length)];
                enemy={name:f.name, hp:Math.round(f.hp*mult), maxHp:Math.round(f.hp*mult), attack:Math.round(f.attack*mult), image:f.image};
                log(`Wild ${enemy.name} appeared!`);
            }else{
                const n = ["Blaze","Frost","Thunder","Star","Luna"][Math.floor(Math.random()*5)] + Math.floor(Math.random()*9999);
                enemy={name:n, hp:100+player.level*30, maxHp:100+player.level*30, attack:12+player.level*4, image:avatars[Math.floor(Math.random()*avatars.length)]};
                log(`You met wizard ${n}!`);
            }
            gameState="battle"; updateUI();
        }
        function castSpell(s){ /* same battle logic – unchanged, works */ 
            let dmg = (s.damage<0 ? s.damage : s.damage + player.level*4) + (player.pet?.bonus||0);
            if (s.damage<0) player.hp = Math.min(player.maxHp, player.hp - dmg);
            else enemy.hp -= dmg;
            log(`Cast ${s.name} → ${s.damage<0 ? 'healed '+-dmg : dmg+' dmg'}`);
            if (enemy.hp<=0){ /* win rewards */ player.exp+=50; /* ... same as before */ gameState="explore"; updateUI(); localStorage.setItem(STORAGE_KEY,JSON.stringify(player)); }
            else { if(!frozen){ player.hp-=Math.max(5,enemy.attack-player.level); } frozen=false; if(player.hp<=0){ gameState="gameover"; } updateUI(); localStorage.setItem(STORAGE_KEY,JSON.stringify(player)); }
        }

        // start
        if (player) updateUI();
    </script>
</body>
</html>
