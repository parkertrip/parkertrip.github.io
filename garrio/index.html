<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garrio</title>
    <link rel="icon" href="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/garrio/images/Your%20paragraph%20text.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- SIGN-IN SCREEN -->
    <div id="sign-in-screen" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-indigo-700">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
            <div class="flex items-center gap-3 mb-8">
                <img src="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/garrio/images/Your%20paragraph%20text.png" class="w-10 h-10">
                <h1 class="text-4xl font-bold text-blue-600">Garrio</h1>
            </div>
            
            <button onclick="googleSignIn()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:border-gray-400 py-4 rounded-2xl text-lg font-medium mb-4">
                <img src="https://www.google.com/favicon.ico" class="w-6 h-6"> Continue with Google
            </button>

            <button onclick="anonymousSignIn()" class="w-full py-4 bg-gray-100 hover:bg-gray-200 rounded-2xl text-lg font-medium mb-8">
                Continue as Guest (Anonymous)
            </button>

            <div class="border-t pt-6">
                <h3 class="text-center text-gray-500 mb-4 text-sm">Or sign in with email</h3>
                <input id="email-input" type="email" placeholder="Email" class="w-full px-5 py-4 border border-gray-300 rounded-2xl mb-3 outline-none focus:border-blue-500">
                <input id="password-input" type="password" placeholder="Password" class="w-full px-5 py-4 border border-gray-300 rounded-2xl mb-6 outline-none focus:border-blue-500">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="emailSignIn()" class="py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-medium">Sign In</button>
                    <button onclick="emailSignUp()" class="py-4 bg-gray-800 hover:bg-black text-white rounded-2xl font-medium">Create Account</button>
                </div>
            </div>

            <!-- AuthPenguin extra sign-in options -->
            <div class="border-t pt-8">
                <h3 class="text-center text-gray-500 mb-4 text-sm">More sign-in options (AuthPenguin)</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="loginWithProvider('discord')" class="py-4 bg-[#5865F2] text-white rounded-2xl font-medium">Discord</button>
                    <button onclick="loginWithProvider('github')" class="py-4 bg-gray-900 text-white rounded-2xl font-medium">GitHub</button>
                    <button onclick="loginWithProvider('scratch')" class="py-4 bg-orange-500 text-white rounded-2xl font-medium">Scratch</button>
                    <button onclick="loginWithProvider('soundcloud')" class="py-4 bg-[#FF5500] text-white rounded-2xl font-medium">SoundCloud</button>
                    <button onclick="loginWithPopupSelector()" class="col-span-2 py-4 bg-indigo-600 text-white rounded-2xl font-medium">Popup selector (all options)</button>
                </div>
            </div>
            
            <p id="signin-error" class="text-red-500 text-center text-sm mt-4 hidden"></p>
        </div>
    </div>

    <!-- MAIN CHAT APP -->
    <div id="main-app" class="hidden flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-white border-r flex flex-col">
            <div class="p-4 border-b flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/garrio/images/Your%20paragraph%20text.png" class="w-8 h-8">
                <h1 class="text-2xl font-semibold text-blue-600">Garrio</h1>
            </div>

            <div class="p-4 border-b">
                <input id="search-input" placeholder="Find user by email..." class="w-full px-4 py-3 border border-gray-300 rounded-3xl text-sm outline-none">
                <button onclick="startDMByEmail()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded-3xl text-sm font-medium">Start new DM</button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <div class="px-4 pt-4 text-xs font-medium text-gray-500">CHATS</div>
                <div id="chats-list" class="px-2"></div>

                <div class="px-4 pt-6 text-xs font-medium text-gray-500 flex justify-between items-center">
                    GROUPS
                    <button onclick="createGroup()" class="text-blue-600 hover:text-blue-700 text-xl leading-none">+</button>
                </div>
                <div id="chats-list-groups" class="px-2"></div>
            </div>

            <div class="border-t p-4">
                <div class="text-xs font-medium text-gray-500 mb-2">PEOPLE</div>
                <div id="people-list" class="max-h-64 overflow-y-auto"></div>
            </div>

            <div id="user-bar" onclick="signOut()" class="p-4 border-t flex items-center gap-3 cursor-pointer hover:bg-gray-50"></div>
        </div>

        <!-- Chat area -->
        <div class="flex-1 flex flex-col">
            <div class="h-14 border-b bg-white px-6 flex items-center justify-between">
                <div id="chat-header" class="font-medium text-lg"></div>
                <button onclick="signOut()" class="text-sm text-gray-500 hover:text-red-500">Sign out</button>
            </div>
            
            <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50"></div>
            
            <div class="p-4 bg-white border-t flex gap-3">
                <button onclick="sendImage()" class="text-3xl px-3">📎</button>
                <input id="message-input" onkeypress="if(event.key==='Enter')sendMessage()" class="flex-1 border border-gray-300 focus:border-blue-500 rounded-3xl px-6 py-3 outline-none text-sm" placeholder="Type a message...">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 rounded-3xl text-sm font-medium">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut as firebaseSignOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlMBEG0FEvpeVRJNMrW4ngLzG80mXMloM",
            authDomain: "garrio-chat.firebaseapp.com",
            databaseURL: "https://garrio-chat-default-rtdb.firebaseio.com",
            projectId: "garrio-chat",
            storageBucket: "garrio-chat.firebasestorage.app",
            messagingSenderId: "1088424175639",
            appId: "1:1088424175639:web:dc115d53a9a6709dfcd452",
            measurementId: "G-0MCBCPHVEG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let currentUser = null;
        let currentChatId = null;
        let messagesUnsub = null;
        let chatsUnsub = null;
        let peopleUnsub = null;

        // AuthPenguin vars
        let authToken = null;
        let customUserData = null;

        // AuthPenguin helpers
        function generateProjectId() {
            const urlParams = new URLSearchParams(window.location.hash.substring(1));
            if (urlParams.has('project_id')) return urlParams.get('project_id');
            const penguinModMatch = window.location.href.match(/#(\d+)/);
            if (penguinModMatch) return `penguinmod_${penguinModMatch[1]}`;
            return `garrio_${Math.random().toString(36).substring(2, 15)}`;
        }

        window.loginWithProvider = (provider) => {
            const origin = encodeURIComponent(window.location.origin);
            const projectId = generateProjectId();
            const popup = window.open(
                `https://oauth.mubilop.com/auth/${provider}?projectId=${projectId}&origin=${origin}`,
                'oauth', 'width=500,height=600,scrollbars=yes,resizable=yes'
            );

            const messageListener = (event) => {
                if (event.data?.type === 'AUTH_SUCCESS') {
                    authToken = event.data.token;
                    window.removeEventListener('message', messageListener);
                    fetch(`https://oauth.mubilop.com/auth/status?projectId=${projectId}`, {
                        headers: { Authorization: `Bearer ${authToken}` }
                    }).then(r => r.json()).then(data => {
                        customUserData = data;
                        handleCustomLogin();
                    }).catch(() => showError("AuthPenguin failed"));
                } else if (event.data?.type === 'AUTH_FAILURE' || event.data?.type === 'AUTH_BLOCKED') {
                    window.removeEventListener('message', messageListener);
                    showError("Login cancelled");
                }
            };
            window.addEventListener('message', messageListener);

            const checkClosed = setInterval(() => {
                if (popup.closed) {
                    clearInterval(checkClosed);
                    window.removeEventListener('message', messageListener);
                }
            }, 1000);
        };

        window.loginWithPopupSelector = () => {
            const origin = encodeURIComponent(window.location.origin);
            const projectId = generateProjectId();
            const popup = window.open(
                `https://oauth.mubilop.com/auth/selector?projectId=${projectId}&origin=${origin}`,
                'oauth-selector', 'width=400,height=500,scrollbars=yes,resizable=yes'
            );

            const messageListener = (event) => {
                if (event.data?.type === 'AUTH_SUCCESS') {
                    authToken = event.data.token;
                    window.removeEventListener('message', messageListener);
                    fetch(`https://oauth.mubilop.com/auth/status?projectId=${projectId}`, {
                        headers: { Authorization: `Bearer ${authToken}` }
                    }).then(r => r.json()).then(data => {
                        customUserData = data;
                        handleCustomLogin();
                    }).catch(() => showError("AuthPenguin failed"));
                } else if (event.data?.type === 'AUTH_FAILURE' || event.data?.type === 'AUTH_BLOCKED') {
                    window.removeEventListener('message', messageListener);
                    showError("Login cancelled");
                }
            };
            window.addEventListener('message', messageListener);

            const checkClosed = setInterval(() => {
                if (popup.closed) {
                    clearInterval(checkClosed);
                    window.removeEventListener('message', messageListener);
                }
            }, 1000);
        };

        function handleCustomLogin() {
            if (!customUserData) return;
            currentUser = {
                uid: customUserData.id || 'custom-' + Date.now(),
                displayName: customUserData.username || customUserData.name || 'User',
                photoURL: customUserData.avatar || null,
                email: customUserData.email || null,
                provider: customUserData.provider || 'authpenguin'
            };
            const signScreen = document.getElementById('sign-in-screen');
            const mainApp = document.getElementById('main-app');
            signScreen.classList.add('hidden');
            mainApp.classList.remove('hidden');

            const bar = document.getElementById('user-bar');
            bar.innerHTML = `${currentUser.photoURL ? `<img src="${currentUser.photoURL}" class="w-9 h-9 rounded-2xl">` : `<div class="w-9 h-9 bg-gray-200 rounded-2xl"></div>`}<div class="flex-1 min-w-0"><div class="font-medium truncate">${currentUser.displayName}</div><div class="text-xs text-gray-500 truncate">${currentUser.email || 'Custom'}</div></div>`;

            // anonymous Firebase for realtime
            signInAnonymously(auth).catch(() => {});
            loadUserChats();
            loadPeople();
        }

        // Original Firebase sign-ins (unchanged)
        window.googleSignIn = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => showError(e.message));
        window.anonymousSignIn = () => signInAnonymously(auth).catch(e => showError(e.message));
        window.emailSignIn = () => {
            const email = document.getElementById('email-input').value.trim();
            const pass = document.getElementById('password-input').value;
            if (email && pass) signInWithEmailAndPassword(auth, email, pass).catch(e => showError(e.message));
        };
        window.emailSignUp = () => {
            const email = document.getElementById('email-input').value.trim();
            const pass = document.getElementById('password-input').value;
            if (email && pass) createUserWithEmailAndPassword(auth, email, pass).catch(e => showError(e.message));
        };

        function showError(msg) {
            const el = document.getElementById('signin-error');
            el.textContent = msg; el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        window.signOut = () => firebaseSignOut(auth);

        // Rest of chat logic (messages now support images/GIFs)
        function switchToChat(chatId, headerName) {
            currentChatId = chatId;
            document.getElementById('chat-header').innerHTML = `<span class="text-blue-600"># </span>${headerName}`;
            loadMessages();
        }

        function loadMessages() {
            if (messagesUnsub) messagesUnsub();
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML = '';
            if (!currentChatId) return;

            const messagesRef = ref(db, `chats/${currentChatId}/messages`);
            messagesUnsub = onValue(messagesRef, (snap) => {
                msgDiv.innerHTML = '';
                const msgs = [];
                snap.forEach(c => msgs.push(c.val()));
                msgs.sort((a,b) => a.timestamp - b.timestamp);
                msgs.forEach(msg => {
                    const mine = msg.uid === currentUser.uid;
                    const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
                    if (msg.isImage) {
                        msgDiv.innerHTML += `
                        <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                            <div class="${mine ? 'bg-blue-600 text-white' : 'bg-white shadow-sm'} rounded-3xl px-5 py-3 max-w-[70%]">
                                ${!mine ? `<div class="text-xs opacity-70 mb-1">${msg.name}</div>` : ''}
                                <img src="${msg.text}" class="max-w-full rounded-3xl cursor-pointer" onclick="window.open('${msg.text}')">
                                <div class="text-[10px] opacity-60 text-right mt-1">${time}</div>
                            </div>
                        </div>`;
                    } else {
                        msgDiv.innerHTML += `
                        <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                            <div class="${mine ? 'bg-blue-600 text-white' : 'bg-white shadow-sm'} rounded-3xl px-5 py-3 max-w-[70%]">
                                ${!mine ? `<div class="text-xs opacity-70 mb-1">${msg.name}</div>` : ''}
                                <div>${msg.text}</div>
                                <div class="text-[10px] opacity-60 text-right mt-1">${time}</div>
                            </div>
                        </div>`;
                    }
                });
                msgDiv.scrollTop = msgDiv.scrollHeight;
            });
        }

        window.sendMessage = () => {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser || !currentChatId) return;
            push(ref(db, `chats/${currentChatId}/messages`), {
                uid: currentUser.uid,
                name: currentUser.displayName || currentUser.email || 'User',
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        };

        window.sendImage = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file || !currentUser || !currentChatId) return;
                const fileRef = storageRef(storage, `chats/${currentChatId}/${Date.now()}_${file.name}`);
                try {
                    await uploadBytes(fileRef, file);
                    const url = await getDownloadURL(fileRef);
                    push(ref(db, `chats/${currentChatId}/messages`), {
                        uid: currentUser.uid,
                        name: currentUser.displayName || currentUser.email || 'User',
                        text: url,
                        isImage: true,
                        timestamp: Date.now()
                    });
                } catch (err) { console.error(err); }
            };
            input.click();
        };

        // Rest of functions (startDMByEmail, startDM, createGroup, loadUserChats, loadPeople) unchanged from previous version
        window.startDMByEmail = () => { /* same as before */ };
        window.startDMByUid = (uid) => { /* same as before */ };
        window.startDM = (otherUser) => { /* same as before */ };
        window.createGroup = () => { /* same as before */ };
        function loadUserChats() { /* same as before */ }
        function loadPeople() { /* same as before */ }

        onAuthStateChanged(auth, async (user) => {
            if (user && !customUserData) { // only for Firebase auth
                currentUser = user;
                const signScreen = document.getElementById('sign-in-screen');
                const mainApp = document.getElementById('main-app');
                signScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                const bar = document.getElementById('user-bar');
                bar.innerHTML = `${user.photoURL ? `<img src="${user.photoURL}" class="w-9 h-9 rounded-2xl">` : `<div class="w-9 h-9 bg-gray-200 rounded-2xl"></div>`}<div class="flex-1 min-w-0"><div class="font-medium truncate">${user.displayName || user.email || 'User'}</div><div class="text-xs text-gray-500 truncate">${user.email || 'Anonymous'}</div></div>`;
                loadUserChats();
                loadPeople();
            }
        });
    </script>
</body>
</html>
