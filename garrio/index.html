<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garrio</title>
    <link rel="icon" href="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/garrio/images/Your%20paragraph%20text.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- SIGN-IN SCREEN -->
    <div id="sign-in-screen" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-600 to-indigo-700">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
            <div class="flex items-center gap-3 mb-8">
                <img src="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/garrio/images/Your%20paragraph%20text.png" class="w-10 h-10">
                <h1 class="text-4xl font-bold text-blue-600">Garrio</h1>
            </div>
            
            <button onclick="googleSignIn()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:border-gray-400 py-4 rounded-2xl text-lg font-medium mb-4">
                <img src="https://www.google.com/favicon.ico" class="w-6 h-6"> Continue with Google
            </button>

            <button onclick="anonymousSignIn()" class="w-full py-4 bg-gray-100 hover:bg-gray-200 rounded-2xl text-lg font-medium mb-8">
                Continue as Guest (Anonymous)
            </button>

            <div class="border-t pt-6">
                <h3 class="text-center text-gray-500 mb-4 text-sm">Or sign in with email</h3>
                <input id="email-input" type="email" placeholder="Email" class="w-full px-5 py-4 border border-gray-300 rounded-2xl mb-3 outline-none focus:border-blue-500">
                <input id="password-input" type="password" placeholder="Password" class="w-full px-5 py-4 border border-gray-300 rounded-2xl mb-6 outline-none focus:border-blue-500">
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="emailSignIn()" class="py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-medium">Sign In</button>
                    <button onclick="emailSignUp()" class="py-4 bg-gray-800 hover:bg-black text-white rounded-2xl font-medium">Create Account</button>
                </div>
            </div>
            
            <p id="signin-error" class="text-red-500 text-center text-sm mt-4 hidden"></p>
        </div>
    </div>

    <!-- MAIN CHAT APP -->
    <div id="main-app" class="hidden flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-white border-r flex flex-col">
            <div class="p-4 border-b flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/parkertrip/parkertrip.github.io/refs/heads/main/garrio/images/Your%20paragraph%20text.png" class="w-8 h-8">
                <h1 class="text-2xl font-semibold text-blue-600">Garrio</h1>
            </div>

            <div class="p-4 border-b">
                <input id="search-input" placeholder="Find user by email..." class="w-full px-4 py-3 border border-gray-300 rounded-3xl text-sm outline-none">
                <button onclick="startDMByEmail()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded-3xl text-sm font-medium">Start new DM</button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <div class="px-4 pt-4 text-xs font-medium text-gray-500">CHATS</div>
                <div id="chats-list" class="px-2"></div>

                <div class="px-4 pt-6 text-xs font-medium text-gray-500 flex justify-between items-center">
                    GROUPS
                    <button onclick="createGroup()" class="text-blue-600 hover:text-blue-700 text-xl leading-none">+</button>
                </div>
                <div id="chats-list-groups" class="px-2"></div>
            </div>

            <div class="border-t p-4">
                <div class="text-xs font-medium text-gray-500 mb-2">PEOPLE</div>
                <div id="people-list" class="max-h-64 overflow-y-auto"></div>
            </div>

            <div id="user-bar" onclick="signOut()" class="p-4 border-t flex items-center gap-3 cursor-pointer hover:bg-gray-50"></div>
        </div>

        <!-- Chat area -->
        <div class="flex-1 flex flex-col">
            <div class="h-14 border-b bg-white px-6 flex items-center justify-between">
                <div id="chat-header" class="font-medium text-lg"></div>
                <button onclick="signOut()" class="text-sm text-gray-500 hover:text-red-500">Sign out</button>
            </div>
            
            <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50"></div>
            
            <div class="p-4 bg-white border-t flex gap-3">
                <input id="message-input" onkeypress="if(event.key==='Enter')sendMessage()" class="flex-1 border border-gray-300 focus:border-blue-500 rounded-3xl px-6 py-3 outline-none text-sm" placeholder="Type a message..." type="text">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 rounded-3xl text-sm font-medium">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut as firebaseSignOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getDatabase, ref, onChildAdded, push, onValue, set, off, onDisconnect } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlMBEG0FEvpeVRJNMrW4ngLzG80mXMloM",
            authDomain: "garrio-chat.firebaseapp.com",
            databaseURL: "https://garrio-chat-default-rtdb.firebaseio.com",
            projectId: "garrio-chat",
            storageBucket: "garrio-chat.firebasestorage.app",
            messagingSenderId: "1088424175639",
            appId: "1:1088424175639:web:dc115d53a9a6709dfcd452",
            measurementId: "G-0MCBCPHVEG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let currentChatId = null;
        let messagesUnsub = null;
        let chatsUnsub = null;
        let peopleUnsub = null;

        async function createUserProfile(user) {
            const userRef = ref(db, `users/${user.uid}`);
            const snap = await new Promise(r => onValue(userRef, r, {onlyOnce: true}));
            if (!snap.exists()) {
                set(userRef, {
                    uid: user.uid,
                    email: user.email || null,
                    name: user.displayName || (user.email ? user.email.split('@')[0] : 'Guest'),
                    photoURL: user.photoURL || null,
                    createdAt: Date.now()
                });
            }
            if (user.isAnonymous) {
                onDisconnect(userRef).remove();
            }
        }

        window.googleSignIn = () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(err => showError(err.message));
        };

        window.anonymousSignIn = () => signInAnonymously(auth).catch(err => showError(err.message));

        window.emailSignIn = () => {
            const email = document.getElementById('email-input').value.trim();
            const pass = document.getElementById('password-input').value;
            if (!email || !pass) return;
            signInWithEmailAndPassword(auth, email, pass).catch(err => showError(err.message));
        };

        window.emailSignUp = () => {
            const email = document.getElementById('email-input').value.trim();
            const pass = document.getElementById('password-input').value;
            if (!email || !pass) return;
            createUserWithEmailAndPassword(auth, email, pass).catch(err => showError(err.message));
        };

        function showError(msg) {
            const el = document.getElementById('signin-error');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        window.signOut = () => firebaseSignOut(auth);

        function switchToChat(chatId, headerName) {
            currentChatId = chatId;
            document.getElementById('chat-header').innerHTML = `<span class="text-blue-600"># </span>${headerName}`;
            loadMessages();
        }

        function loadMessages() {
            if (messagesUnsub) off(messagesUnsub);
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML = '';
            if (!currentChatId) return;
            const messagesRef = ref(db, `chats/${currentChatId}/messages`);
            messagesUnsub = onChildAdded(messagesRef, (snap) => {
                const msg = snap.val();
                const mine = msg.uid === currentUser.uid;
                msgDiv.innerHTML += `
                <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                    <div class="${mine ? 'bg-blue-600 text-white' : 'bg-white shadow-sm'} rounded-3xl px-5 py-3 max-w-[70%]">
                        ${!mine ? `<div class="text-xs opacity-70 mb-1">${msg.name}</div>` : ''}
                        <div>${msg.text}</div>
                        <div class="text-[10px] opacity-60 text-right mt-1">${new Date(msg.timestamp).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</div>
                    </div>
                </div>`;
                msgDiv.scrollTop = msgDiv.scrollHeight;
            });
        }

        window.sendMessage = () => {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser || !currentChatId) return;
            const messagesRef = ref(db, `chats/${currentChatId}/messages`);
            push(messagesRef, {
                uid: currentUser.uid,
                name: currentUser.displayName || currentUser.email || 'User',
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        };

        window.startDMByEmail = () => {
            const email = document.getElementById('search-input').value.trim().toLowerCase();
            if (!email) return;
            const usersRef = ref(db, 'users');
            onValue(usersRef, (snap) => {
                let found = null;
                snap.forEach(child => {
                    const u = child.val();
                    if (u.email && u.email.toLowerCase() === email) found = u;
                });
                off(usersRef, 'value');
                if (found && found.uid !== currentUser.uid) startDM(found);
                else alert("User not found");
            }, {onlyOnce: true});
        };

        window.startDMByUid = (uid) => {
            if (uid === currentUser.uid) return;
            const userRef = ref(db, `users/${uid}`);
            onValue(userRef, (snap) => {
                const other = snap.val();
                off(userRef, 'value');
                if (other) startDM(other);
            }, {onlyOnce: true});
        };

        window.startDM = (otherUser) => {
            const ids = [currentUser.uid, otherUser.uid].sort();
            const chatId = ids.join('_');
            set(ref(db, `userChats/${currentUser.uid}/${chatId}`), {
                type: 'dm',
                name: otherUser.name || otherUser.email,
                otherUid: otherUser.uid
            });
            set(ref(db, `userChats/${otherUser.uid}/${chatId}`), {
                type: 'dm',
                name: currentUser.displayName || currentUser.email || 'User',
                otherUid: currentUser.uid
            });
            switchToChat(chatId, otherUser.name || otherUser.email);
        };

        window.createGroup = () => {
            const name = prompt("Group name?");
            if (!name) return;
            const groupId = 'group_' + Date.now();
            set(ref(db, `userChats/${currentUser.uid}/${groupId}`), {
                type: 'group',
                name: name
            });
            switchToChat(groupId, name);
        };

        function loadUserChats() {
            if (chatsUnsub) off(chatsUnsub);
            const list = document.getElementById('chats-list');
            const groupList = document.getElementById('chats-list-groups');
            chatsUnsub = onValue(ref(db, `userChats/${currentUser.uid}`), (snap) => {
                list.innerHTML = '';
                groupList.innerHTML = '';
                snap.forEach(child => {
                    const data = child.val();
                    const chatId = child.key;
                    const el = document.createElement('div');
                    el.className = `px-4 py-3 hover:bg-blue-50 rounded-2xl cursor-pointer flex items-center gap-3 ${currentChatId === chatId ? 'bg-blue-50' : ''}`;
                    el.innerHTML = `
                        <div class="w-8 h-8 bg-gray-200 rounded-2xl flex-shrink-0"></div>
                        <div class="flex-1 truncate">${data.name}</div>
                    `;
                    el.onclick = () => switchToChat(chatId, data.name);
                    if (data.type === 'group') groupList.appendChild(el);
                    else list.appendChild(el);
                });
            });
        }

        function loadPeople() {
            if (peopleUnsub) off(peopleUnsub);
            const container = document.getElementById('people-list');
            peopleUnsub = onValue(ref(db, 'users'), (snap) => {
                container.innerHTML = '';
                snap.forEach(child => {
                    const u = child.val();
                    if (u.uid === currentUser.uid) return;
                    const el = document.createElement('div');
                    el.className = "flex items-center gap-3 px-3 py-3 hover:bg-gray-50 rounded-2xl cursor-pointer";
                    el.innerHTML = `
                        ${u.photoURL ? `<img src="${u.photoURL}" class="w-8 h-8 rounded-2xl">` : `<div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-xs font-bold">${(u.name||'?')[0]}</div>`}
                        <div class="flex-1">
                            <div class="font-medium">${u.name}</div>
                            <div class="text-xs text-gray-500">${u.email || ''}</div>
                        </div>
                        <button onclick="event.stopImmediatePropagation();startDMByUid('${u.uid}')" class="text-xs bg-blue-600 text-white px-4 py-1 rounded-3xl">Message</button>
                    `;
                    container.appendChild(el);
                });
            });
        }

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const signScreen = document.getElementById('sign-in-screen');
            const mainApp = document.getElementById('main-app');

            if (user) {
                signScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                await createUserProfile(user);
                const bar = document.getElementById('user-bar');
                bar.innerHTML = `
                    ${user.photoURL ? `<img src="${user.photoURL}" class="w-9 h-9 rounded-2xl">` : `<div class="w-9 h-9 bg-gray-200 rounded-2xl"></div>`}
                    <div class="flex-1 min-w-0">
                        <div class="font-medium truncate">${user.displayName || user.email || 'User'}</div>
                        <div class="text-xs text-gray-500 truncate">${user.email || 'Anonymous'}</div>
                    </div>
                `;
                loadUserChats();
                loadPeople();
            } else {
                signScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
                if (messagesUnsub) off(messagesUnsub);
                if (chatsUnsub) off(chatsUnsub);
                if (peopleUnsub) off(peopleUnsub);
            }
        });
    </script>
</body>
</html>
